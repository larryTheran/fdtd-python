name: Numerical and integration checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Isolate scientific Python runtime state
        shell: bash
        run: |
          for key in MPLCONFIGDIR IPYTHONDIR JUPYTER_CONFIG_DIR JUPYTER_DATA_DIR JUPYTER_RUNTIME_DIR; do
            directory="$RUNNER_TEMP/$key"
            mkdir -p "$directory"
            echo "$key=$directory" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-notebook.txt
            constraints-ci.txt
      - name: Install scientific and test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-notebook.txt -c constraints-ci.txt
      - name: Check all physics and CLI fixtures
        run: python -m pytest -q
      - name: Verify actual Jupyter live frames on a tiny grid
        run: python tools/check_live_fdtd.py
      - name: Confirm complete experiment catalogs
        run: |
          python run_all.py --list
          python run_all_3d.py --list
